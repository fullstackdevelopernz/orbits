<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORBITS by Eden Toy Co. | Plush Bag Charms</title>
  <meta name="description" content="ORBITS by Eden Toy Co. — playful premium plush bag charms made to clip on, collect and gift.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/branding/orbits-logo.png">
  <link rel="apple-touch-icon" href="assets/branding/orbits-logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="eden-experience.css">
  <link rel="stylesheet" href="pop-art.css">
  <link rel="stylesheet" href="campaign.css">
  <link rel="stylesheet" href="full-bleed-hero.css">
  <link rel="stylesheet" href="hero-message.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="collection-diagonal.css">
  <link rel="stylesheet" href="account-auth.css">
  <link rel="stylesheet" href="paypal-checkout.css">
</head>
<body>
  <div class="floating-commerce-nav" aria-label="Store shortcuts">
    <a href="#shop">Shop</a>
    <a href="#search">Search</a>
    <a href="#account">Account</a>
    <button class="cart-button" id="cartButton" aria-label="Open bag">Bag <span id="cartCount">0</span></button>
  </div>

  <main id="app">
    <section class="loading-stage" aria-label="Loading ORBITS">
      <img class="loading-orbits-logo" src="assets/branding/orbits-logo.png" alt="ORBITS">
      <p>Loading your Orbits…</p>
    </section>
  </main>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head">
      <div>
        <img class="cart-orbits-logo" src="assets/branding/orbits-logo.png" alt="ORBITS">
        <h2>Your Preorder Bag</h2>
        <p class="cart-subbrand">Your favourite first-release Orbits, all in one place.</p>
      </div>
      <button id="closeCart" class="icon-button" aria-label="Close cart">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="subtotal"><span>Subtotal</span><strong id="subtotal">$0.00 NZD</strong></div>
      <button class="primary wide" id="checkoutButton">Continue preorder</button>
      <p class="fineprint">Choose Pay by Bank with BlinkPay or PayPal at secure checkout.</p>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <footer class="site-footer compact-footer">
    <div class="compact-footer-inner">
      <span class="compact-footer-distributor">Distributed by Eden Toy Co.</span>
      <a class="compact-footer-email-button" href="mailto:orders@edentoyco.com">orders@edentoyco.com</a>
      <a class="footer-wordmark compact-footer-logo" href="#home" aria-label="ORBITS home">orbits</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="full-bleed-hero.js"></script>
  <script src="auth.js"></script>
  <script src="customer-session.js"></script>
  <script src="paypal-checkout.js"></script>
  <script src="payment-health.js"></script>
</body>
</html>
