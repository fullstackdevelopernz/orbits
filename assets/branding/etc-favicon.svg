<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ETC favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3e6"/>
      <stop offset="100%" stop-color="#ff9cc6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#d46798" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Arial Rounded MT Bold, Baloo, Fredoka, Nunito, sans-serif" font-size="23" font-weight="700" fill="#fff6fb" letter-spacing="1">ETC</text>
  </g>
</svg>
